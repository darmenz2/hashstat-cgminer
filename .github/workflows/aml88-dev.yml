name: AML88 bench driver CI

on:
  push:
    branches: [work/aml88-driver]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 make clang autoconf automake libtool pkg-config
      - name: Host verification (no ASIC access)
        run: |
          set -euo pipefail
          unset HASHSTAT_AML88_CONFIG
          mkdir -p "$RUNNER_TEMP/aml88-logs" "$RUNNER_TEMP/aml88-native"
          make check 2>&1 | tee "$RUNNER_TEMP/aml88-logs/check.log"
          make runtime CC=clang 2>&1 | tee "$RUNNER_TEMP/aml88-logs/runtime.log"
          make aml88-test 2>&1 | tee "$RUNNER_TEMP/aml88-logs/aml88.log"
          make native NATIVE_CC="$(command -v clang)" JOBS=2 OUTPUT_PARENT="$RUNNER_TEMP/aml88-native" 2>&1 | tee "$RUNNER_TEMP/aml88-logs/native.log"
      - name: Collect native receipts and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/aml88-logs"
          find "$RUNNER_TEMP/aml88-native" -maxdepth 2 -type f \( -name '*.log' -o -name 'receipt.json' \) -exec cp --parents {} "$RUNNER_TEMP/aml88-logs" \; || true
          git rev-parse HEAD > "$RUNNER_TEMP/aml88-logs/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml88-host-validation
          path: /home/runner/work/_temp/aml88-logs
          retention-days: 7
          if-no-files-found: error
