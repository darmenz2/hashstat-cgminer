name: AML88 build prerequisites
on:
  push:
    branches: [work/aml88-driver]
    paths: [.github/workflows/aml88-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch pinned compiler and user-mode emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aml88-build-tools"
          cd "$RUNNER_TEMP/aml88-build-tools"
          curl --fail --location --retry 2 --max-time 180 --proto '=https' --tlsv1.2 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig-x86_64-linux-0.16.0.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig-x86_64-linux-0.16.0.tar.xz' | sha256sum -c -
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static
          cp /usr/bin/qemu-aarch64-static .
          qemu-aarch64-static --version > qemu-version.txt
          dpkg-query -W qemu-user-static > qemu-package.txt
          cp /usr/share/doc/qemu-user-static/copyright qemu-copyright.txt
          sha256sum zig-x86_64-linux-0.16.0.tar.xz qemu-aarch64-static > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aml88-build-prerequisites
          path: ${{ runner.temp }}/aml88-build-tools
          retention-days: 3
          if-no-files-found: error
